[package]
name = "tq-app"
description = "Native operator / viewer app: GPUI window, VideoToolbox decode, the tq protocol in-process"
# Released on its own: tags `app-vX.Y.Z` (see docs/install.md).
version = "0.3.0"
edition.workspace = true
publish.workspace = true
build = "../../build/version.rs"
# gpui-pre (through gpui-kit) uses std APIs stabilized in 1.95.
rust-version = "1.95"

[dependencies]
tq-media = { workspace = true }
tq-proto = { workspace = true }
tq-transport = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
# GPUI comes through gpui-kit, which pins the gpui-pre snapshot it builds on.
gpui-kit = "0.7.3"
semver = "1"
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Same versions as gpui-pre, so a CVPixelBuffer from the decoder is the
# type gpui's surface() element takes.
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# NVDEC through the NVIDIA driver, dlopen'd at runtime (libcuda through
# cudarc, libnvcuvid through moq-nvenc's cuvid table): the build needs no
# CUDA toolkit or driver.
cudarc = { version = "0.19", default-features = false, features = ["driver", "fallback-dynamic-loading", "cuda-12020"] }
moq-nvenc = "0.1.2"
libloading = "0.9"
# gpui's RenderImage takes `image` frames; same major version as gpui.
image = { version = "0.25", default-features = false }
