[workspace]
resolver = "2"
members = ["crates/*"]
# tq-app (GPUI) is a large build; `cargo build` without -p skips it.
default-members = [
    "crates/tq-media",
    "crates/tq-proto",
    "crates/tq-publisher",
    "crates/tq-relay",
    "crates/tq-tools",
    "crates/tq-transport",
]

[workspace.package]
# Libraries and tools. The released binaries (tq-relay, tq-publisher, tq-app)
# carry their own versions.
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tq-media = { path = "crates/tq-media" }
tq-proto = { path = "crates/tq-proto" }
tq-transport = { path = "crates/tq-transport" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "aws-lc-rs"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
web-transport-quinn = "0.13.1"

[profile.release]
debug = 1
