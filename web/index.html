<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tq · tele over QUIC</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5c400" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <strong id="title">tq</strong>
      <span id="role" class="pill"></span>
      <span id="session" class="pill"></span>
      <span id="conn" class="pill warn">starting</span>
      <span id="publisher" class="pill">broadcasts –</span>
      <span id="robots" class="pill" hidden></span>
      <button id="stop" hidden title="Every robot in the room safe-stops at once, whoever drives it, and stays stopped until its drive lock is claimed again (Space)">STOP</button>
      <span id="stop-status" class="pill"></span>
      <span class="spacer"></span>
      <span id="clock" class="pill"></span>
      <span id="ui" class="pill"></span>
      <span id="viewers" class="pill"></span>
      <span id="versions" class="pill"></span>
      <button id="edit" title="Add, move, resize and bind widgets">Edit layout</button>
    </header>

    <div id="toolbar" class="row" hidden></div>

    <main id="board"></main>

    <footer>
      <details>
        <summary>Diagnostics</summary>
        <pre id="publisher-detail"></pre>
        <pre id="link"></pre>
      </details>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
